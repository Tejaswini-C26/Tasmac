    <!-- Dome / Tower -->
    <polygon points="260,60 210,110 310,110" fill="#f59e0b"/>
    <!-- Base Platform -->
    <rect x="10" y="220" width="280" height="24" rx="6" fill="#71717a"/>
    <!-- Shield / Government Security Seal -->
    <path d="M150 20 L230 50 L230 110 C230 150 150 190 150 190 C150 190 70 150 70 110 L70 50 Z" fill="none" stroke="#22c55e" stroke-width="8"/>
    <path d="M130 90 L145 105 L175 75" fill="none" stroke="#22c55e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

