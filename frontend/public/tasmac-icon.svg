<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#090a0d"/>
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="#ea580c" stroke-width="8" stroke-opacity="0.6"/>
  <!-- Central Emblem / Grid -->
  <g transform="translate(106, 106)">
    <!-- Factory / Warehouse Node -->
    <path d="M40 220 L40 100 L110 140 L110 100 L180 140 L180 220 Z" fill="#f97316" fill-opacity="0.9" stroke="#ea580c" stroke-width="8"/>
